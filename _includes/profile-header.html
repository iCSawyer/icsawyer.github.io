{% assign author = site.author %}
<header class="profile-header" itemscope itemtype="http://schema.org/Person">
  {% comment %} A button (not a .jpg link) so the theme's default lightbox stays out of the way {% endcomment %}
  <button type="button" class="profile-header__photo" data-photo-full="{{ '/assets/images/photo-large.jpg' | relative_url }}" data-photo-alt="{{ author.name }}" data-photo-caption="Thanks for the interest (?) 🤔" aria-label="View larger photo" aria-haspopup="dialog">
    <img class="profile-header__avatar" src="{{ author.avatar | relative_url }}" alt="{{ author.name }}" itemprop="image">
  </button>
  <div class="profile-header__title">
    <h1 class="profile-header__name" itemprop="name">{{ author.name }}</h1>
    <ul class="profile-header__links">
      <li><a href="mailto:{{ author.email }}" title="Email" aria-label="Email"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i></a></li>
      <li><a href="https://scholar.google.com/citations?user={{ author.google_scholar }}&hl=en" title="Google Scholar" aria-label="Google Scholar" itemprop="sameAs"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i></a></li>
      <li><a href="https://www.linkedin.com/in/{{ author.linkedin }}" title="LinkedIn" aria-label="LinkedIn" itemprop="sameAs"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i></a></li>
      <li><a href="https://github.com/{{ author.github }}" title="GitHub" aria-label="GitHub" itemprop="sameAs"><i class="fab fa-fw fa-github" aria-hidden="true"></i></a></li>
      <li><a href="https://x.com/{{ author.twitter }}" title="Twitter" aria-label="Twitter" itemprop="sameAs"><i class="fab fa-fw fa-twitter" aria-hidden="true"></i></a></li>
    </ul>
  </div>
  {% if include.intro %}
  <div class="profile-header__intro">
    {{ include.intro | markdownify }}
  </div>
  {% endif %}
</header>

<dialog class="photo-viewer" aria-label="Photo">
  <div class="photo-viewer__frame">
    <div class="photo-viewer__photo">
      <img class="photo-viewer__img" alt="">
    </div>
    <div class="photo-viewer__caption"></div>
  </div>
  <button type="button" class="photo-viewer__close" aria-label="Close">&times;</button>
</dialog>

<script>
  // Any element with data-photo-full opens that photo here (optional data-photo-alt / data-photo-caption)
  (function () {
    var viewer = document.querySelector('.photo-viewer');
    if (!viewer) return;
    var frame = viewer.querySelector('.photo-viewer__frame');
    var img = viewer.querySelector('.photo-viewer__img');
    var caption = viewer.querySelector('.photo-viewer__caption');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    // Load and decode a photo ahead of time, so opening doesn't stutter
    var loading = {};
    function preload(url) {
      if (!loading[url]) {
        var probe = new Image();
        probe.src = url;
        loading[url] = probe.decode().catch(function () {});
      }
      return loading[url];
    }

    function triggerFor(event) {
      return event.target.closest ? event.target.closest('[data-photo-full]') : null;
    }

    function warmUp(event) {
      var trigger = triggerFor(event);
      if (trigger) preload(trigger.dataset.photoFull);
    }
    document.addEventListener('pointerover', warmUp);
    document.addEventListener('focusin', warmUp);
    document.addEventListener('touchstart', warmUp, { passive: true });

    document.addEventListener('click', function (event) {
      var trigger = triggerFor(event);
      if (!trigger || viewer.open) return;
      var url = trigger.dataset.photoFull;
      if (!viewer.showModal) { window.location.href = url; return; } // very old browsers
      preload(url).then(function () {
        img.src = url;
        img.alt = trigger.dataset.photoAlt || '';
        viewer.setAttribute('aria-label', img.alt || 'Photo');
        caption.textContent = trigger.dataset.photoCaption || '';
        caption.hidden = !trigger.dataset.photoCaption;
        return img.decode().catch(function () {});
      }).then(function () {
        if (!viewer.open) viewer.showModal();
      });
    });

    // Closing plays the opening animation in reverse, then closes the dialog
    function closeViewer() {
      if (!viewer.open || viewer.classList.contains('is-closing')) return;
      if (reduceMotion.matches) { viewer.close(); return; }
      viewer.classList.add('is-closing');
      frame.addEventListener('animationend', function () {
        viewer.classList.remove('is-closing');
        viewer.close();
      }, { once: true });
    }

    // A click anywhere (photo, backdrop or the close button) closes it; so does Esc
    viewer.addEventListener('click', closeViewer);
    viewer.addEventListener('cancel', function (event) {
      event.preventDefault();
      closeViewer();
    });
  })();
</script>
